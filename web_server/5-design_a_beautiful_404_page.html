<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 &mdash; Not Found</title>
<style>
  :root {
    --blue: #14315c;
    --blue-soft: #2d4a7a;
    --red: #b5122e;
    --paper: #faf9f6;
    --ink: #2b2b2b;
    --ink-soft: #6b6b6b;
    --line: #e2dfd8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
  }

  .wall {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .exhibit-label {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 1.6rem;
  }

  .exhibit-label span {
    color: var(--red);
  }

  .number {
    font-size: clamp(5rem, 18vw, 9rem);
    line-height: 1;
    font-weight: 400;
    color: var(--blue);
    letter-spacing: 0.02em;
    margin: 0;
  }

  .divider {
    width: 48px;
    height: 2px;
    background: var(--red);
    margin: 1.8rem auto;
    border: none;
  }

  .title {
    font-style: italic;
    font-size: 1.5rem;
    color: var(--blue-soft);
    margin: 0 0 1.4rem;
  }

  .frame {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 1.1rem 0;
    margin: 0 0 2.2rem;
  }

  .frame dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.35rem 0.9rem;
    max-width: 320px;
    margin: 0 auto;
    text-align: left;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.82rem;
  }

  .frame dt {
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.68rem;
    align-self: center;
  }

  .frame dd {
    margin: 0;
    color: var(--ink);
  }

  .caption {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 2.4rem;
  }

  .return {
    display: inline-block;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    color: var(--paper);
    background: var(--blue);
    padding: 0.75rem 1.8rem;
    border-radius: 2px;
    transition: background 0.2s ease;
  }

  .return:hover {
    background: var(--red);
  }

  .mark {
    margin-top: 3.5rem;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .mark b {
    color: var(--blue);
    font-weight: 600;
  }

  .mark i {
    color: var(--red);
    font-style: normal;
  }
</style>
</head>
<body>
  <main class="wall">
    <p class="exhibit-label">Exhibit N<span>o</span> 404</p>
    <p class="number">404</p>
    <hr class="divider">
    <p class="title">&ldquo;Ceci n'est pas une page&rdquo;</p>

    <div class="frame">
      <dl>
        <dt>Artist</dt>
        <dd>Mathiang Mathew</dd>
        <dt>Medium</dt>
        <dd>Broken hyperlink, mixed signals</dd>
        <dt>Year</dt>
        <dd>2026</dd>
      </dl>
    </div>

    <p class="caption">
      This page has either left the collection or was never acquired.<br>
      Everything else is still on display.
    </p>

    <a class="return" href="/">Return to the gallery</a>

    <p class="mark"><b>Junub</b> <i>Webbers</i></p>
  </main>
</body>
</html>
